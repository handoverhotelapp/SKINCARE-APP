<title>Routine Settimanale · The Ordinary</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream:#f5f0eb; --rose:#e4649a; --navy:#2d3561;
    --warm-white:#faf8f5; --text:#1a1a1a; --muted:#8a8580; --border:#e0d8d0;
    --morning-soft:#fdebd0; --morning-accent:#c97c10;
    --evening-soft:#d0d6f0; --evening-accent:#2d3561;
    --sea:#e0f0f8; --sea-acc:#1a6a8a;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--cream);font-family:'DM Mono',monospace;color:var(--text);min-height:100vh;}

  /* HERO */
  .hero{background:var(--warm-white);border-bottom:1px solid var(--border);padding:16px 18px 12px;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.05);}
  .hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .clock-time{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:300;line-height:1;color:var(--navy);}
  .clock-time em{font-style:italic;color:var(--rose);}
  .clock-date{font-size:9px;color:var(--muted);letter-spacing:0.12em;text-transform:uppercase;margin-top:4px;}
  .session-pill{padding:6px 12px;border-radius:20px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;flex-shrink:0;margin-top:4px;border:1px solid transparent;}
  .session-pill.morning{background:var(--morning-soft);color:var(--morning-accent);border-color:#f0c070;}
  .session-pill.evening{background:var(--evening-soft);color:var(--evening-accent);border-color:#b0bae8;}
  .session-pill.dot{width:6px;height:6px;border-radius:50%;}

  /* MINI CALENDAR */
  .mini-cal{background:var(--cream);border-radius:10px;padding:9px 11px;border:1px solid var(--border);}
  .cal-month{font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:7px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;}
  .cal-head{font-size:7px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);text-align:center;padding:2px 0;}
  .cal-day{font-size:9px;text-align:center;padding:4px 2px;border-radius:6px;color:var(--muted);}
  .cal-day.other{color:#ccc;}
  .cal-day.today{background:var(--navy);color:white;}
  .cal-day.weekend-day{background:#e0f0f8;color:var(--sea-acc);}
  .cal-day.today.weekend-day{background:var(--sea-acc);color:white;}

  /* DAY NAV */
  .day-nav{display:flex;gap:6px;padding:12px 14px;overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--warm-white);border-bottom:1px solid var(--border);scrollbar-width:none;}
  .day-nav::-webkit-scrollbar{display:none;}
  .day-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 11px;border-radius:12px;border:1.5px solid var(--border);background:white;cursor:pointer;transition:all 0.18s;min-width:50px;}
  .day-btn .ab{font-size:8px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
  .day-btn .nm{font-family:'Cormorant Garamond',serif;font-size:14px;color:var(--text);}
  .day-btn.active{background:var(--navy);border-color:var(--navy);}
  .day-btn.active .ab{color:rgba(255,255,255,0.55);}
  .day-btn.active .nm{color:white;}
  .day-btn.today-btn{border-color:var(--rose);}
  .day-btn.weekend-btn{border-color:var(--sea-acc);}
  .day-btn.weekend-btn .ab{color:var(--sea-acc);}
  .day-btn.active.weekend-btn{background:var(--sea-acc);border-color:var(--sea-acc);}

  /* CONTENT */
  .content{padding:16px 14px 60px;max-width:480px;margin:0 auto;}

  .day-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;}
  .day-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:300;color:var(--navy);}
  .day-title em{font-style:italic;color:var(--rose);}
  .day-note{font-size:8px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}

  /* SESSION TOGGLE */
  .session-toggle{display:flex;gap:8px;margin-bottom:14px;}
  .tog-btn{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--border);background:white;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all 0.2s;display:flex;align-items:center;justify-content:center;gap:6px;}
  .tog-btn.active.morning{background:var(--morning-soft);border-color:var(--morning-accent);color:var(--morning-accent);}
  .tog-btn.active.evening{background:var(--evening-soft);border-color:var(--evening-accent);color:var(--evening-accent);}
  .tog-btn.active.sea{background:var(--sea);border-color:var(--sea-acc);color:var(--sea-acc);}

  /* PROGRESS */
  .prog-wrap{margin-bottom:14px;}
  .prog-row{display:flex;justify-content:space-between;margin-bottom:4px;}
  .prog-label{font-size:8px;color:var(--muted);letter-spacing:0.1em;text-transform:uppercase;}
  .prog-count{font-size:8px;color:var(--rose);}
  .prog-bar{height:3px;background:var(--border);border-radius:3px;overflow:hidden;}
  .prog-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--navy));border-radius:3px;transition:width 0.4s;}

  /* BANNER */
  .banner{border-radius:12px;padding:11px 13px;margin-bottom:12px;display:flex;align-items:flex-start;gap:10px;font-size:9px;line-height:1.65;}
  .banner.warn{background:#fff8e1;border:1px solid #ffe082;color:#6d4c00;}
  .banner.info{background:var(--sea);border:1px solid #a0cce0;color:#1a4a5a;}
  .banner.notice{background:#f3e5f5;border:1px solid #ce93d8;color:#4a1060;}
  .banner-icon{font-size:16px;flex-shrink:0;}
  .banner b{display:block;font-size:8px;letter-spacing:0.12em;text-transform:uppercase;margin-bottom:3px;}

  /* STEP */
  .step{background:white;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;position:relative;}
  .step::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px;}
  .step.morning::before{background:var(--morning-accent);}
  .step.evening::before{background:var(--evening-accent);}
  .step.sea::before{background:var(--sea-acc);}
  .step.done .step-top{opacity:0.45;}

  .step-top{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;cursor:pointer;}
  .chk{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--border);flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
  .step.done .chk{background:var(--rose);border-color:var(--rose);}
  .step.done .chk::after{content:'';display:block;width:4px;height:8px;border:2px solid white;border-top:none;border-left:none;transform:rotate(45deg) translate(-1px,-1px);}
  .step-body{flex:1;}
  .step-name{font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--navy);line-height:1.2;}
  .step.done .step-name{text-decoration:line-through;color:var(--muted);}
  .step-sub{font-size:9px;color:var(--muted);margin-top:2px;line-height:1.5;}
  .step-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:9px;}
  .b-drops{background:#f0f0f0;color:#555;}
  .b-warn{background:#fff0d0;color:#8a5c00;}
  .b-ok{background:#e6f4ea;color:#2e7d32;}
  .b-eyes{background:#e8f4fd;color:#1565c0;}
  .b-rare{background:#f3e5f5;color:#6a1b9a;}

  /* MOVEMENT */
  .move-btn{width:100%;background:#fdf0f6;border:none;border-top:1px solid #f5d9ea;padding:9px 13px;display:flex;align-items:center;gap:8px;cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;color:#880e4f;transition:background 0.15s;text-align:left;}

  .move-btn .mv-label{flex:1;letter-spacing:0.04em;}
  .move-detail{display:none;padding:12px 14px 14px;background:#fdf5f9;border-top:1px solid #f0c8dc;font-size:10px;color:#5a1f3a;line-height:1.8;}
  .move-detail.open{display:block;}
  .move-detail .mv-title{display:block;font-size:8px;letter-spacing:0.15em;text-transform:uppercase;color:var(--rose);margin-bottom:5px;}

  .reset-btn{display:block;width:100%;padding:12px;margin-top:14px;border:1px solid var(--border);border-radius:12px;background:white;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all 0.15s;}
  .reset-btn:hover{border-color:var(--rose);color:var(--rose);}

  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .step{animation:fadeUp 0.2s ease both;}
</style>
</head>

<div class="content" id="mainContent"></div>

<script>
const MESI   = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GIORNI = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
function pad2(n){return String(n).padStart(2,'0');}
function jsDayToIdx(d){return (d+6)%7;} // 0=Lun..6=Dom
function getSlot(h){return (h>=5&&h<20)?'morning':'evening';}

function updateClock(){
  const now=new Date();
  const h=now.getHours(),m=now.getMinutes();
  document.getElementById('clockTime').innerHTML=`${pad2(h)}<em>:</em>${pad2(m)}`;
  document.getElementById('clockDate').textContent=`${GIORNI[now.getDay()]} ${now.getDate()} ${MESI[now.getMonth()]} ${now.getFullYear()}`;
  const slot=getSlot(h);
  const pill=document.getElementById('sessionPill');
  pill.className=`session-pill ${slot}`;
  pill.textContent=slot==='morning'?'☀️ Routine mattina':'🌙 Routine sera';
  return slot;
}

function buildCalendar(){
  const now=new Date();
  const today=now.getDate(), month=now.getMonth(), year=now.getFullYear();
  const firstJsDay=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const startOffset=(firstJsDay+6)%7;
  document.getElementById('calMonth').textContent=`${MESI[month]} ${year}`;
  let html='';
  ['Lu','Ma','Me','Gi','Ve','Sa','Do'].forEach(d=>html+=`<div class="cal-head">${d}</div>`);
  for(let i=0;i<startOffset;i++) html+=`<div class="cal-day other"></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const jsDay=new Date(year,month,d).getDay();
    const isWeekend=jsDay===0||jsDay===6;
    const isToday=d===today;
    let cls='cal-day';
    if(isToday&&isWeekend) cls+=' today weekend-day';
    else if(isToday) cls+=' today';
    else if(isWeekend) cls+=' weekend-day';
    html+=`<div class="${cls}">${d}</div>`;
  }
  document.getElementById('calGrid').innerHTML=html;
}

function buildDayNav(){
  const now=new Date();
  const jsDay=now.getDay();
  const todayIdx=jsDayToIdx(jsDay);
  const monday=new Date(now);
  monday.setDate(now.getDate()-todayIdx);
  const btns=document.querySelectorAll('.day-btn');
  btns.forEach((btn,i)=>{
    const d=new Date(monday);
    d.setDate(monday.getDate()+i);
    btn.querySelector('.nm').textContent=pad2(d.getDate());
    if(i===todayIdx) btn.classList.add('today-btn');
  });
}

const moves={

  nmf_ha:    {icon:"🤲",label:"Stendere · movimenti lifting ↑",           detail:"<span class='mv-title'>Come applicare</span>Scalda tra i palmi. Stendi sempre dal basso verso l'alto e dal centro verso l'esterno. Mai verso il basso."},
  nmf_phyto: {icon:"🤲",label:"Stendere abbondante · lifting ↑",          detail:"<span class='mv-title'>Come applicare</span>Usala generosamente. Scalda tra i palmi, stendi con movimenti ascendenti. Finisci premendo i palmi caldi 6–8 sec per zona."},
  spf:       {icon:"☀️",label:"Pat uniforme · no massaggio forte",        detail:"<span class='mv-title'>Come applicare</span>2–3 pompe viso + collo. Stendi con polpastrelli, unifica con mani piatte leggere. Non massaggiare forte. Ri-applica ogni 2h al sole."},
};

  nmf_phyto:  {name:"NMF + PhytoCeramides · Crema Ricca",     sub:"Barriera notturna · nutrimento intenso",              drops:"nocciola abbondante",   tag:"b-drops", mv:"nmf_phyto"},

// ── DAYS ─────────────────────────────────────────────────────
// idx 0=Lun 1=Mar 2=Mer 3=Gio 4=Ven 5=Sab 6=Dom
const days=[

    evening:[P.glycolic_e,P.niacin,P.hyaluron,P.eyeserum,P.volufi,P.nmf_phyto]},

  // MERCOLEDÌ — Retinolo sera
  { name:"Mercoledì", note:"Retinolo sera", type:"week", conflict:null,

  { name:"Giovedì", note:"Glycolic sera · no Retinolo", type:"week",

      {name:"Caffeine Solution 5% + EGCG",   sub:"Occhi gonfi col caldo · facoltativo",                    drops:"1 goccia",       tag:"b-eyes", mv:"caffeine"},

// ── STATE ────────────────────────────────────────────────────
const state=days.map(d=>{
  const s={
    morning: new Array(d.morning.length).fill(false),
    evening: new Array(d.evening.length).fill(false),
  };
  if(d.spiaggia) s.spiaggia=new Array(d.spiaggia.length).fill(false);
  return s;
});
const openMoves={};
let currentDay=0;
let currentSlot='morning';

// ── BUILD ────────────────────────────────────────────────────
function buildStepHtml(step, i, slotKey, dayIdx){
  const mv=moves[step.mv];
  const key=`${dayIdx}-${slotKey}-${i}`;
  const isOpen=!!openMoves[key];
  const isDone=state[dayIdx][slotKey][i];
  const cls=slotKey==='morning'?'morning':slotKey==='spiaggia'?'sea':'evening';
  return `
    <div class="step ${cls} ${isDone?'done':''}">
      <div class="step-top" onclick="toggleStep(${dayIdx},'${slotKey}',${i})">
        <div class="chk"></div>
        <div class="step-body">
          <div class="step-name">${step.name}</div>
          <div class="step-sub">${step.sub}</div>
          <div class="step-badges"><span class="badge ${step.tag}">${step.drops}</span></div>
        </div>
      </div>
      <button class="move-btn ${isOpen?'open':''}" onclick="toggleMove('${key}')">
        <span class="mv-icon">${mv.icon}</span>
        <span class="mv-label">${mv.label}</span>
        <span>${isOpen?'▲':'▼'}</span>
      </button>
      <div class="move-detail ${isOpen?'open':''}">${mv.detail}</div>
    </div>`;
}

function renderContent(){
  const d=days[currentDay];
  const s=state[currentDay];
  const isWeekend=d.type==='weekend';

  // Progress
  const arr=d[currentSlot]||[];
  const ch=s[currentSlot]||[];
  const done=ch.filter(Boolean).length;
  const total=arr.length;
  const pct=total?Math.round((done/total)*100):0;

  // Toggle buttons
  let toggles='';
  if(isWeekend){
    toggles=`
      <button class="tog-btn ${currentSlot==='morning'?'active morning':''}" onclick="setSlot('morning')">☀️ Mattina</button>
      <button class="tog-btn ${currentSlot==='spiaggia'?'active sea':''}" onclick="setSlot('spiaggia')">🌊 Spiaggia</button>
      <button class="tog-btn ${currentSlot==='evening'?'active evening':''}" onclick="setSlot('evening')">🌙 Sera</button>`;
  } else {
    toggles=`
      <button class="tog-btn ${currentSlot==='morning'?'active morning':''}" onclick="setSlot('morning')">☀️ Mattina</button>
      <button class="tog-btn ${currentSlot==='evening'?'active evening':''}" onclick="setSlot('evening')">🌙 Sera</button>`;
  }

  // Banners
  let banners='';
  if(d.conflict && currentSlot==='evening'){
    banners+=`<div class="banner warn"><div class="banner-icon">⚠️</div><div>${d.conflict}</div></div>`;
  }
  if(isWeekend && currentSlot==='evening' && currentDay===6){
    banners+=`<div class="banner notice"><div class="banner-icon">✨</div><div><b>Retinolo ok stasera!</b>Domani non vai al mare — la pelle non sarà esposta al sole diretto. Puoi riprendere il Retinal 0.2% questa sera.</div></div>`;
  }
  if(isWeekend && currentSlot==='spiaggia'){
    banners+=`<div class="banner info"><div class="banner-icon">💦</div><div><b>Uriage Eau Thermale</b>Gesto fisso ogni ora e dopo ogni bagno — calma, reintegra minerali, prepara la pelle all'SPF.</div></div>`;
  }
  if(currentDay===4 && currentSlot==='evening'){
    banners+=`<div class="banner warn"><div class="banner-icon">🌊</div><div><b>Domani è sabato al mare!</b>Niente Retinolo stasera: la pelle resterà sensibilizzata tutto il weekend. La domenica sera puoi riprendere.</div></div>`;
  }

  // Steps
  const steps=arr.map((step,i)=>buildStepHtml(step,i,currentSlot,currentDay)).join('');

  document.getElementById('mainContent').innerHTML=`
    <div class="day-header">
      <div class="day-title">${d.name.slice(0,3)}<em>${d.name.slice(3)}</em></div>
      <div class="day-note">${d.note}</div>
    </div>
    <div class="session-toggle">${toggles}</div>
    <div class="prog-wrap">
      <div class="prog-row">
        <span class="prog-label">Completamento</span>
        <span class="prog-count">${done}/${total} step</span>
      </div>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
    </div>
    ${banners}
    ${steps}
    <button class="reset-btn" onclick="resetSlot()">↺ Reset ${currentSlot==='morning'?'mattina':currentSlot==='spiaggia'?'spiaggia':'sera'} di ${d.name}</button>
  `;
}

function showDay(idx,btn){
  currentDay=idx;
  const d=days[idx];
  // auto-set slot sensibly for weekend
  if(d.type==='weekend' && currentSlot!=='morning' && currentSlot!=='spiaggia' && currentSlot!=='evening') currentSlot='morning';
  document.querySelectorAll('.day-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderContent();
}

function setSlot(slot){
  currentSlot=slot;
  renderContent();
}

function toggleStep(dayIdx,slotKey,i){
  state[dayIdx][slotKey][i]=!state[dayIdx][slotKey][i];
  renderContent();
}

function toggleMove(key){
  openMoves[key]=!openMoves[key];
  renderContent();
}

function resetSlot(){
  state[currentDay][currentSlot]=new Array(days[currentDay][currentSlot].length).fill(false);
  renderContent();
}

// ── INIT ─────────────────────────────────────────────────────
const slot=updateClock();
setInterval(updateClock,1000);
buildCalendar();
buildDayNav();

const todayJsDay=new Date().getDay();
currentDay=jsDayToIdx(todayJsDay);
currentSlot=getSlot(new Date().getHours());
// weekend ha spiaggia di default pomeriggio — se è giorno e weekend usa spiaggia
const d=days[currentDay];
if(d.type==='weekend' && currentSlot==='morning' && new Date().getHours()>=10) currentSlot='spiaggia';
if(d.type==='weekend' && currentSlot==='morning' && new Date().getHours()>=20) currentSlot='evening';

document.querySelectorAll('.day-btn').forEach((b,i)=>b.classList.toggle('active',i===currentDay));
renderContent();
</script>
</body>
